name: Gerar APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Dependências
        run: npm install

      - name: Gerar Build do Projeto
        run: npx vite build

      - name: Criar index.html com os Scripts do App
        run: |
          mkdir -p .vercel/output/static
          
          # Pega os nomes dos arquivos JS e CSS gerados no build
          JS_FILE=$(basename $(ls .vercel/output/static/assets/index-*.js | head -n 1))
          CSS_FILE=$(basename $(ls .vercel/output/static/assets/styles-*.css 2>/dev/null | head -n 1 || echo ""))
          
          # Cria o HTML vinculando o JS e o CSS
          cat <<EOF > .vercel/output/static/index.html
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Rosa Game</title>
            <link rel="stylesheet" href="./assets/$CSS_FILE">
          </head>
          <body>
            <div id="root"></div>
            <script type="module" src="./assets/$JS_FILE"></script>
          </body>
          </html>
          EOF

      - name: Sincronizar Capacitor
        run: npx cap sync

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: meu-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk