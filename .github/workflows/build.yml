name: Gerar APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Dependências
        run: npm install

      - name: Gerar Build do Projeto
        run: npx vite build

      - name: Criar index.html estático
        run: |
          mkdir -p .vercel/output/static
          echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>App</title></head><body><div id="root"></div></body></html>' > .vercel/output/static/index.html

      - name: Sincronizar Capacitor
        run: npx cap sync

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: meu-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk